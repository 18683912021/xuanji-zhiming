[project]
name = "xuanji-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "fastapi>=0.135,<1",
    "httpx2>=2.16,<3",
    "lunar-python>=1.4,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-ai-slim[openai]>=1,<3",
    "pydantic[email]>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
    "pyephemera==0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
